name: nf-core linting and stubbing
on:
  push:
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    container: nfcore/gitpod:3.2.0
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: prettier
        run: prettier -c ${{ github.workspace }}
      - name: nf-core lint
        run: nf-core pipelines lint -d ${{ github.workspace }} -w
